# WEIGHTS: autorisasjon, environment at22.
#
# This file is autorisasjon's alone. It is the review unit for shifting autorisasjon's
# traffic in at22 -- CODEOWNERS points it at autorisasjon, so other teams never have
# to approve a rollout that is not theirs, and vice versa.
#
# Weights are relative, not percentages. backendRefs[0] is the legacy cluster
# via the nginx proxy. Every service is at 100 -- nothing has migrated yet.
#
# When a service's second backend is uncommented in teams/autorisasjon/<service>/
# httproute.yaml, add the matching backendRefs[1] op below to give it a weight
# in this environment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../teams/autorisasjon

patches:
  # altinn-access-management: 100% to the legacy cluster.
  - target: {group: policy.linkerd.io, kind: HTTPRoute, name: altinn-access-management}
    patch: |
      - op: replace
        path: /spec/rules/0/backendRefs/0/weight
        value: 100
      # - op: replace
      #   path: /spec/rules/0/backendRefs/1/weight
      #   value: 0
  # altinn-authentication: 100% to the legacy cluster.
  - target: {group: policy.linkerd.io, kind: HTTPRoute, name: altinn-authentication}
    patch: |
      - op: replace
        path: /spec/rules/0/backendRefs/0/weight
        value: 100
      # - op: replace
      #   path: /spec/rules/0/backendRefs/1/weight
      #   value: 0
  # altinn-authorization: 100% to the legacy cluster.
  - target: {group: policy.linkerd.io, kind: HTTPRoute, name: altinn-authorization}
    patch: |
      - op: replace
        path: /spec/rules/0/backendRefs/0/weight
        value: 100
      # - op: replace
      #   path: /spec/rules/0/backendRefs/1/weight
      #   value: 0
  # altinn-register: 100% to the legacy cluster.
  - target: {group: policy.linkerd.io, kind: HTTPRoute, name: altinn-register}
    patch: |
      - op: replace
        path: /spec/rules/0/backendRefs/0/weight
        value: 100
      # - op: replace
      #   path: /spec/rules/0/backendRefs/1/weight
      #   value: 0
  # altinn-resource-registry: 100% to the legacy cluster.
  - target: {group: policy.linkerd.io, kind: HTTPRoute, name: altinn-resource-registry}
    patch: |
      - op: replace
        path: /spec/rules/0/backendRefs/0/weight
        value: 100
      # - op: replace
      #   path: /spec/rules/0/backendRefs/1/weight
      #   value: 0
