# Inbound authorization for the canary backend. Same shape as the proxy's, but
# with its own MeshTLSAuthentication -- see allowed-clients.yaml for why it
# cannot share a service's.

apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: kubewrapper-dummy-http
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubewrapper-dummy
  port: http
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: kubewrapper-dummy-http
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: kubewrapper-dummy-http
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: dummy-allowed-clients
