apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubewrapper-dummy
  labels:
    app.kubernetes.io/name: kubewrapper-dummy
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kubewrapper-dummy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubewrapper-dummy
      annotations:
        # Must be meshed: it is a backendRef of a Linkerd HTTPRoute.
        linkerd.io/inject: enabled
    spec:
      serviceAccountName: kubewrapper-dummy
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: kubewrapper-dummy-nginx
            items:
              - key: nginx.conf
                path: default.conf
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
