# Dummy backend for the weighted split.
#
# Mirrors the upstream's surface: it answers 200 on
# /kuberneteswrapper/api/v1/deployments and 404 everywhere else, exactly as the
# real service does. Answering every path would mask a rewrite bug -- the whole
# point is that a request arriving on the wrong path should fail here too.
#
# Both responses carry "kubewrapper-dummy" in the body, so you can still tell
# which backend served a request even when the answer is a 404.
#
# $hostname is nginx's built-in machine hostname, which in a Deployment pod is
# the pod name -- so no downward API or config templating is needed.

log_format  dummy_json escape=json
  '{'
    '"time":"$time_iso8601",'
    '"backend":"kubewrapper-dummy",'
    '"pod":"$hostname",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"orig_host":"$http_host"'
  '}';

# Health listener on its own port, so that no request path served to callers is
# shadowed by a local route.
server {
    listen       8081;
    server_name  _;
    access_log   off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

server {
    listen       8080;
    server_name  _;

    access_log   /dev/stdout dummy_json;
    error_log    /dev/stderr warn;

    default_type application/json;

    # The one path the upstream serves. '=' is an exact match, and nginx
    # excludes the query string from location matching, so ...?foo=bar still
    # lands here.
    location = /kuberneteswrapper/api/v1/deployments {
        return 200 '{"backend":"kubewrapper-dummy","greeting":"hello from the new cluster","pod":"$hostname","method":"$request_method","path":"$request_uri","host":"$http_host","headers":{"x-forwarded-for":"$http_x_forwarded_for","x-forwarded-host":"$http_x_forwarded_host","x-forwarded-proto":"$http_x_forwarded_proto","user-agent":"$http_user_agent"}}\n';
    }

    # Anything else: 404, like the real service, but still self-identifying so
    # a mis-routed request can be traced to this backend.
    location / {
        return 404 '{"backend":"kubewrapper-dummy","error":"no handler for this path","pod":"$hostname","method":"$request_method","path":"$request_uri","expected":"/kuberneteswrapper/api/v1/deployments"}\n';
    }
}
