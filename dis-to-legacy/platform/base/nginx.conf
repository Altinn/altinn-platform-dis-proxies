# The shared proxy config. Identical for every service and every cluster.
#
# Callers reach a service at
#   http://<legacy-service-name>.<namespace>.svc.cluster.local
# and requests are forwarded verbatim (no path rewrite) to the legacy cluster's
# internal ingress. WHICH ingress is per-cluster, so it is not in this file --
# it comes from the 'legacy-upstream' ConfigMap that the environment supplies,
# mounted at /etc/nginx/upstream/. This file is identical in every environment.

log_format  proxy_json escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"orig_host":"$http_host",'
    '"user_agent":"$http_user_agent"'
  '}';

# Health/readiness listener, on its own port.
#
# Separate from the proxy port for two reasons: no upstream path can ever be
# shadowed by a locally served route, and creating a Linkerd Server for the
# proxy port does not remove the automatic kubelet probe allowance, which only
# applies to ports with no Server.
server {
    listen       8081;
    server_name  _;
    access_log   off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

# The proxy itself. This is the port the Service targets.
server {
    listen       8080;
    server_name  _;

    access_log   /dev/stdout proxy_json;
    error_log    /dev/stderr warn;

    # The kubernetes-api-wrapper can stream (watch, log tail) and is not
    # request-size bounded, so do not buffer or cap bodies.
    client_max_body_size      0;
    proxy_buffering           off;
    proxy_request_buffering   off;

    # WHICH BASE PATHS THIS PROXY WILL FORWARD.
    #
    # Supplied per service, from the team's own folder, as one or more location
    # blocks. This file stays identical for every service -- it declares where
    # the allow-list comes from, not what is in it.
    #
    # See <service>/proxy/allowed-paths.conf in the team folder.
    include /etc/nginx/allowed/*.conf;

    # Anything not matched by an allowed location above. Without this the proxy
    # would be an open door into the legacy cluster for every path the legacy
    # ingress serves, not just the one API this service exposes.
    #
    # Self-identifying so a blocked request is diagnosable, but it does not name
    # the paths that ARE allowed.
    location / {
        default_type application/json;
        return 404 '{"error":"path not allowed by this proxy","proxy":"$hostname","path":"$request_uri"}\n';
    }
}
