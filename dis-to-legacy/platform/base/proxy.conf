# The proxying itself. Shared by every service and every cluster.
#
# Included from inside a location block in a service's allowed-paths.conf, so it
# may only contain directives valid there. The per-service file decides WHICH
# paths reach this; this file decides what happens to them.

# LOOP GUARD.
#
# Once both directions carry weight a request can cross and re-cross: this cluster
# sends a share to the other one, whose own weight sends a share straight back.
#
# nginx does both halves. A request arriving WITHOUT the hop header gets one and is
# forwarded; a request arriving WITH one has already crossed, so it is refused
# instead of forwarded again. That is why the header is set here rather than by an
# HTTPRoute RequestHeaderModifier filter -- a filter can only add a header, never
# reject on one, so it would mark requests without guarding anything. It would also
# mean this proxy received the header on its own outbound leg and refused its own
# traffic.
#
# 508 is Loop Detected (RFC 5842), and is deliberately distinct from everything
# else this proxy returns: 404 for a path it does not serve, 502 for an upstream it
# could not reach, 403 for inbound policy. A 508 means exactly one thing.
#
# Do NOT add retry policy for 508. It is not transient, and retrying amplifies the
# loop it exists to stop.
#
# 'if' is normally discouraged in nginx, but 'return' is one of the two directives
# officially safe inside it, which is the form used here.
if ($http_x_dis_migration_hop) {
    return 508 '{"error":"loop detected","proxy":"$hostname","path":"$request_uri"}\n';
}
proxy_set_header X-Dis-Migration-Hop 1;

# Content type for responses nginx generates itself, such as the 508 above.
# Proxied responses keep whatever Content-Type the upstream sent.
default_type application/json;

# Everything that names the legacy cluster: proxy_pass, the Host rewrite and the
# TLS server name. Supplied per environment, outside this repo.
include /etc/nginx/upstream/upstream.conf;

# proxy_pass in that file has no URI component, so the original request URI and
# query string are forwarded verbatim -- the location prefix above does not get
# stripped. Restricting which paths are allowed does NOT rewrite them.

proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_http_version 1.1;
proxy_set_header   Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout    1h;
proxy_read_timeout    1h;
