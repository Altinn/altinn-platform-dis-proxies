# WHICH BASE PATHS 'kubewrapper-two' MAY BE PROXIED TO THE LEGACY CLUSTER.
#
# THIS TEAM OWNS THIS FILE. Anything not matched here gets a 404 from the proxy
# and never reaches the legacy cluster.
#
# PLACEHOLDER: /kubewrapper-two/ is a guess. Set this to the base path the
# legacy service actually serves before relying on it -- until then every real
# request to this service will 404.

location /kubewrapper-two/ {
    include /etc/nginx/proxy/proxy.conf;
}
