# This service's own nginx pod, instantiated from the shared base.
#
# Same config as every other service -- the base is app-agnostic and forwards
# the paths allowed below. Only the names and labels differ, so that one
# service's traffic cannot land on another's pods.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../platform/base
  # This service's allow-list. Prefixed along with everything else here, so it
  # cannot collide with another service's in the shared namespace.
  - allowed-clients.yaml

configMapGenerator:
  # The base paths this proxy will forward. Prefixed and hash-suffixed with
  # everything else here, so editing it rolls only this service's pods.
  - name: allowed-paths
    files:
      - allowed-paths.conf

namePrefix: kubewrapper-two-

labels:
  - pairs:
      dis.altinn.no/proxy-for: kubewrapper-two
    includeSelectors: true
