# WHICH BASE PATHS 'kuberneteswrapper-kubernetes-api-wrapper' MAY BE PROXIED TO THE LEGACY CLUSTER.
#
# THIS TEAM OWNS THIS FILE. Anything not matched here gets a 404 from the proxy
# and never reaches the legacy cluster -- so the shim is a door to this service's
# API, not to everything the legacy ingress happens to serve.
#
# Included inside the proxy's server block, so it may only contain location
# blocks. Add one per base path the service exposes.
#
# The prefix is NOT stripped: proxy_pass has no URI component, so the original
# path is forwarded verbatim. Restricting paths does not rewrite them.
#
# Adding an endpoint outside these prefixes means a 404 until this file is
# updated -- which looks like a routing bug, so it is worth knowing.

location /kuberneteswrapper/ {
    include /etc/nginx/proxy/proxy.conf;
}
