# Who may call 'kuberneteswrapper-kubernetes-api-wrapper'. THIS TEAM OWNS THIS FILE.
#
# Identity comes from the caller's ServiceAccount. Because every migrated
# service shares one namespace, callers are named:
#   <their-serviceaccount>.default.serviceaccount.identity.linkerd.cluster.local
#
# A whole namespace can be admitted with a wildcard:
#   *.default.serviceaccount.identity.linkerd.cluster.local
#
# It lives under proxy/ because namePrefix has to reach it: the name below
# becomes 'kubewrapper-allowed-clients' -- the prefix is the short one, not
# the legacy service name -- which is what keeps one service's allow-list
# from colliding with another's in the shared namespace. The
# AuthorizationPolicy's reference follows the rename automatically, via the
# nameReference rules in platform/base/kustomizeconfig.yaml.
#
# Leave this out and the policy references a MeshTLSAuthentication that does not
# exist, which fails closed: every caller gets 403.
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: allowed-clients
spec:
  identities:
    - "poc-client.default.serviceaccount.identity.linkerd.cluster.local"
