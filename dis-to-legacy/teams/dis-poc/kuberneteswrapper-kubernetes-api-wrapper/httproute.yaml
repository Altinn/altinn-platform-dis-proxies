# The weighted split, parented on the anchor Service.
#
# Committed state is 100% to the legacy cluster, with the canary listed
# explicitly below at weight 0: all backends pre-created at weight 0, plus a
# synthetic canary so the path is proven before any weight moves.
#
# Weights are relative, not percentages -- 90/10 sends a tenth to the canary,
# 50/50 is an even split, and 0 parks a backend without removing it. Shift them
# in envs/<env>/dis-poc/, or transiently against the live route with
# 'kubectl patch httproute'.
#
# NOTE: this only takes effect for callers running a Linkerd proxy. Outbound
# policy is applied client-side.
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: kuberneteswrapper-kubernetes-api-wrapper
spec:
  parentRefs:
    - group: core
      kind: Service
      name: kuberneteswrapper-kubernetes-api-wrapper
      port: 80
  rules:
    # No matches block: this rule matches every request.
    - backendRefs:
        - name: kubewrapper-proxy
          port: 80
          weight: 100
        # The canary, in its own namespace -- modelling a real migrated app,
        # which always lands in a namespace of its own. Deployed separately:
        #   kubectl kustomize dis-to-legacy/platform/dummy | kubectl apply -f -
        #
        # This cross-namespace hop is the thing the POC is meant to prove: that
        # Linkerd resolves a backendRef into another namespace, and whether a
        # ReferenceGrant is needed (the Linkerd reference does not mention one).
        - name: kubewrapper-dummy
          namespace: test-proxy-vga-app
          port: 80
          weight: 0
