# WHICH BASE PATHS 'altinn-receipt' MAY BE PROXIED TO THE LEGACY CLUSTER.
#
# THIS TEAM OWNS THIS FILE. Anything not matched here gets a 404 from the proxy
# and never reaches the legacy cluster -- so the shim is a door to this service's
# API, not to everything the legacy ingress happens to serve.
#
# Included inside the proxy's server block, so it may only contain location
# blocks. Add one per base path the service exposes.
#
# The prefix is NOT stripped: proxy_pass has no URI component, so the original
# path is forwarded verbatim. Restricting paths does not rewrite them.
#
# Adding an endpoint outside these prefixes means a 404 until this file is
# updated -- which looks like a routing bug, so it is worth knowing.
#
# The prefixes below mirror the PathPrefix rules on this service's IngressRoute
# in the legacy cluster, so a caller sees the same paths through the shim as it
# does today.
#
# MATCHING FORM. '^<prefix>(/|$)' matches the bare prefix and everything under
# it, but not a longer word starting with it -- '/register' and
# '/register/api/v1/parties' match, '/registerfoo' does not. A plain
# 'location <prefix>/' would 404 the bare path, which Traefik's PathPrefix
# accepts today; a plain 'location <prefix>' would let '/registerfoo' through.
# These are regex locations, so they take precedence over the catch-all
# 'location /' in nginx.conf regardless of order.

location ~ ^/receipt(/|$) {
    include /etc/nginx/proxy/proxy.conf;
}
