name: Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kustomize-diff:
    uses: dis-way/actions/.github/workflows/kustomize-diff.yml@8a0034943836baaa34c7e220854f950ce3a5f370 # main
    with:
      build-paths: "dis-to-legacy/envs/*"
    permissions:
      contents: read
      pull-requests: write
